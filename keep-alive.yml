          curl -sf "https://mfblcwqycypgyifeeisb.supabase.co/rest/v1/company?select=id" \
            -H "apikey: sb_publishable_yEq3iwLEJ52eUYqcn7X7uw_-mlwqCas" -o /dev/null -w "HTTP %{http_code}\n"
